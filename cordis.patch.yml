# Install this package as one DSH profile bundle. The profile's later user
# patch may replace this row to select remote mode or expose the local API.
- insert:
    - id: knowledge
      name: 'dsh-knowledge'
      config:
        backend: local
        # 数据目录由插件选择：优先非系统盘（例如 G:\dsh-knowledge），
        # 也可用环境变量 DSH_KNOWLEDGE_HOME 指定；不再默认写到 C 盘用户目录。
        exposeApi: false
        exposeWeb: true
        extractionEnabled: true
