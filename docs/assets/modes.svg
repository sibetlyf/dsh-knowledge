<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="DSH Knowledge 四种运行模式：本地、中央、远程、团队云">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="top2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .t2 { font: 700 28px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; letter-spacing: -0.4px; }
      .s2 { font: 400 13.5px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .ct { font: 600 16px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .cb { font: 400 12px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .tag { font: 600 10.5px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2563eb; }
      .node { font: 600 12px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .small { font: 400 10.5px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg2)"/>
  <text x="64" y="70" class="t2">四种运行模式</text>
  <text x="64" y="96" class="s2">同一套知识领域能力，按“数据在哪里、谁在协作”选择不同部署方式。</text>
  <rect x="64" y="118" width="100" height="4" rx="2" fill="url(#top2)"/>

  <!-- Card 1 local -->
  <g filter="url(#s2)">
    <rect x="64" y="150" width="520" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="64" y="150" width="6" height="220" rx="3" fill="#2563eb"/>
    <text x="90" y="184" class="ct">本地个人模式</text>
    <rect x="456" y="164" width="102" height="24" rx="7" fill="#eff6ff"/>
    <text x="470" y="180" class="tag">零额外服务</text>
    <text x="90" y="207" class="cb">DSH 插件直接读写本机 SQLite；知识、笔记、日报、日历都在本机。</text>

    <rect x="94" y="238" width="170" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="116" y="261" class="node">DSH Web / Agent</text>
    <text x="116" y="278" class="small">同源管理台与 side panel</text>

    <rect x="332" y="238" width="208" height="56" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="354" y="261" class="node">本地 Knowledge Provider</text>
    <text x="354" y="278" class="small">SQLite + FTS5 + note vault</text>

    <path d="M264 266 H332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M332 280 H264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="286" y="255" class="small">读写</text>

    <text x="94" y="330" class="cb">适合：个人资料、项目知识、离线使用；公网暴露 DSH 时由反向代理保护整站。</text>
    <text x="94" y="350" class="small">数据位置：knowledge.sqlite / note-workspaces / artifacts</text>
  </g>

  <!-- Card 2 central -->
  <g filter="url(#s2)">
    <rect x="616" y="150" width="520" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="616" y="150" width="6" height="220" rx="3" fill="#7c3aed"/>
    <text x="642" y="184" class="ct">中央知识模式</text>
    <rect x="1008" y="164" width="102" height="24" rx="7" fill="#f5f3ff"/>
    <text x="1022" y="180" class="tag">多端共享</text>
    <text x="642" y="207" class="cb">DSH 自身充当中央服务，多客户端通过 HTTPS + Bearer Token 读写同一库。</text>

    <rect x="646" y="232" width="118" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="660" y="252" class="node">客户端 A</text>
    <text x="660" y="267" class="small">read / propose</text>
    <rect x="646" y="284" width="118" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="660" y="304" class="node">客户端 B</text>
    <text x="660" y="319" class="small">read / write</text>

    <rect x="842" y="248" width="258" height="68" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="862" y="274" class="node">中央 DSH · Knowledge API</text>
    <text x="862" y="293" class="small">管理台 + 逐库挂载 + 令牌权限</text>

    <path d="M764 268 H842" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M842 288 H764" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>

    <text x="646" y="350" class="cb">令牌原文只显示一次；远程连接必须 HTTPS，仅回环地址允许 HTTP。</text>
  </g>

  <!-- Card 3 remote -->
  <g filter="url(#s2)">
    <rect x="64" y="392" width="520" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="64" y="392" width="6" height="220" rx="3" fill="#059669"/>
    <text x="90" y="426" class="ct">远程客户端模式</text>
    <rect x="456" y="406" width="102" height="24" rx="7" fill="#ecfdf5"/>
    <text x="470" y="422" class="tag">集中运维</text>
    <text x="90" y="449" class="cb">本机不复制数据库；召回、回写、日报、笔记全部走中央，断网不悄悄回退本地。</text>

    <rect x="94" y="480" width="170" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="116" y="503" class="node">DSH 远程客户端</text>
    <text x="116" y="521" class="small">同源代理，不暴露 Token</text>

    <rect x="332" y="480" width="208" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="354" y="503" class="node">中央 Provider</text>
    <text x="354" y="521" class="small">召回 / 回写 / 日报 / 笔记</text>

    <path d="M264 509 H332" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M332 524 H264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="286" y="499" class="small">HTTPS</text>
    <text x="94" y="573" class="cb">远程失败时明确报错；本地笔记、文件与既有数据保留但不会自动上传。</text>
  </g>

  <!-- Card 4 team -->
  <g filter="url(#s2)">
    <rect x="616" y="392" width="520" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="616" y="392" width="6" height="220" rx="3" fill="#d97706"/>
    <text x="642" y="426" class="ct">独立团队云模式</text>
    <rect x="1008" y="406" width="102" height="24" rx="7" fill="#fff7ed"/>
    <text x="1022" y="422" class="tag">无需安装 DSH</text>
    <text x="642" y="449" class="cb">服务器运行独立 Node.js 团队知识服务，浏览器、成员、文件、Wiki、日报各自成环。</text>

    <rect x="646" y="472" width="126" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="660" y="493" class="node">团队成员</text>
    <text x="660" y="509" class="small">浏览器登录</text>
    <rect x="646" y="532" width="126" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="660" y="553" class="node">本地 DSH</text>
    <text x="660" y="569" class="small">sync-local</text>

    <rect x="846" y="480" width="254" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="866" y="507" class="node">团队知识服务</text>
    <text x="866" y="526" class="small">成员 · 角色 · 文档 · 文件 · 问答</text>
    <text x="866" y="543" class="small">Wiki · 数据源 · 日报 · 审计</text>
    <text x="866" y="560" class="small">SQLite WAL + FTS5 + 磁盘文件</text>

    <path d="M772 500 H846" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M772 556 H846" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>

    <text x="646" y="598" class="cb">云端数据源、自动 Wiki、大模型日报总结与关键词；管理台默认只对登录成员开放。</text>
  </g>

  <text x="64" y="654" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">运行模式不是数据“复制”：本地、中央、远程、团队云各自拥有明确的数据权威与同步边界。</text>
</svg>
