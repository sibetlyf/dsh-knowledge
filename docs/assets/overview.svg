<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="DSH Knowledge 系统全景：DSH 宿主、知识核心、存储与团队服务">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; letter-spacing: -0.5px; }
      .subtitle { font: 400 14px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .column { font: 600 12px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; letter-spacing: 1.4px; }
      .card-title { font: 600 15px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .card-body { font: 400 12.5px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .metric { font: 700 20px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2563eb; }
      .metric-label { font: 400 11px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .pill { font: 600 11px 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #2563eb; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <circle cx="1108" cy="92" r="118" fill="#2563eb" opacity="0.05"/>
  <circle cx="1010" cy="700" r="150" fill="#7c3aed" opacity="0.05"/>

  <text x="64" y="74" class="title">dsh-knowledge · 系统全景</text>
  <text x="64" y="101" class="subtitle">一个插件，连接对话、知识、笔记、工作记录与团队云；核心内容始终可检索、可引用、可审核、可恢复。</text>
  <rect x="64" y="124" width="96" height="4" rx="2" fill="url(#accent)"/>
  <rect x="173" y="124" width="38" height="4" rx="2" fill="#cbd5e1"/>

  <!-- Column labels -->
  <text x="64" y="176" class="column">DSH 宿主与入口</text>
  <text x="440" y="176" class="column">知识核心</text>
  <text x="816" y="176" class="column">存储与团队服务</text>

  <!-- Left column -->
  <g filter="url(#shadow)">
    <rect x="64" y="196" width="336" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="82" y="216" width="38" height="38" rx="10" fill="#eff6ff"/>
    <path d="M93 241h16m-8-8v16" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="134" y="232" class="card-title">对话与 Agent</text>
    <text x="134" y="253" class="card-body">模型与用户进出知识的唯一入口</text>
    <text x="134" y="272" class="card-body">不修改 DSH Agent Loop</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="304" width="336" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="82" y="324" width="38" height="38" rx="10" fill="#f5f3ff"/>
    <path d="M92 343l7-7 7 7m-7-7v16" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <text x="134" y="340" class="card-title">knowledge 统一工具</text>
    <text x="134" y="361" class="card-body">一个入口按需发现 22 项操作</text>
    <text x="134" y="380" class="card-body">检索 · 读取 · 笔记 · 日报 · 日历</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="412" width="336" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="82" y="432" width="38" height="38" rx="10" fill="#ecfdf5"/>
    <path d="M92 451l5 5 11-11" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="134" y="448" class="card-title">召回 · 引用 · 回写</text>
    <text x="134" y="469" class="card-body">挂载范围内自动召回，回答后审核回写</text>
    <text x="134" y="488" class="card-body">句柄读取、行号引用、冲突保护</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="520" width="336" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="82" y="540" width="38" height="38" rx="10" fill="#fff7ed"/>
    <path d="M94 559h14m-7 0v-10m0 20v-10" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <text x="134" y="556" class="card-title">笔记 · 日报 · 日历</text>
    <text x="134" y="577" class="card-body">独立笔记工作区，工作记录与时间安排</text>
    <text x="134" y="596" class="card-body">早晨卡片汇总今天该做什么</text>
  </g>

  <!-- Center core -->
  <g filter="url(#shadow)">
    <rect x="440" y="196" width="336" height="416" rx="22" fill="#0f172a"/>
    <rect x="440" y="196" width="336" height="6" rx="3" fill="url(#accent)"/>
    <text x="468" y="236" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Knowledge Provider</text>
    <text x="468" y="259" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#94a3b8">本地 / 中央 / 远程共用的领域层</text>

    <rect x="464" y="282" width="288" height="58" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="482" y="306" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Provider Router</text>
    <text x="482" y="325" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94a3b8">按当前连接选择本地或远程</text>

    <rect x="464" y="352" width="288" height="58" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="482" y="376" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">检索与分块索引</text>
    <text x="482" y="395" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94a3b8">FTS5 · 章节 · 行号 · 版本校验</text>

    <rect x="464" y="422" width="288" height="58" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="482" y="446" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">审核与版本状态</text>
    <text x="482" y="465" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94a3b8">候选 · 冲突 · 封存 · 恢复 · 审计</text>

    <rect x="464" y="492" width="288" height="58" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="482" y="516" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">笔记 · 日报 · 日历运行时</text>
    <text x="482" y="535" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#94a3b8">独立存储，不与知识正文混写</text>

    <rect x="464" y="562" width="288" height="30" rx="8" fill="#111c33"/>
    <text x="482" y="582" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">挂载是召回前提，不是写入授权</text>
  </g>

  <!-- Right column -->
  <g filter="url(#shadow)">
    <rect x="816" y="196" width="320" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="834" y="216" width="38" height="38" rx="10" fill="#eff6ff"/>
    <ellipse cx="853" cy="230" rx="10" ry="3.6" fill="none" stroke="#2563eb" stroke-width="1.7"/>
    <path d="M843 230v12c0 2 4.5 3.6 10 3.6s10-1.6 10-3.6v-12M843 236c0 2 4.5 3.6 10 3.6s10-1.6 10-3.6" fill="none" stroke="#2563eb" stroke-width="1.7"/>
    <text x="886" y="232" class="card-title">本地 SQLite</text>
    <text x="886" y="253" class="card-body">知识正文、版本、索引、任务队列</text>
    <text x="886" y="272" class="card-body">单机即开即用，无需额外服务</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="816" y="304" width="320" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="834" y="324" width="38" height="38" rx="10" fill="#f5f3ff"/>
    <circle cx="853" cy="337" r="5" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
    <circle cx="841" cy="349" r="3.4" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
    <circle cx="865" cy="349" r="3.4" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
    <path d="M850 341l-6 5m12-5l-6 5" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="886" y="340" class="card-title">中央知识服务</text>
    <text x="886" y="361" class="card-body">DSH 自身 WebServer + Bearer Token</text>
    <text x="886" y="380" class="card-body">多客户端共享；本地管理台独立</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="816" y="412" width="320" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="834" y="432" width="38" height="38" rx="10" fill="#ecfdf5"/>
    <circle cx="847" cy="445" r="3.6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="859" cy="445" r="3.6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <path d="M841 457c0-3.2 2.7-5 6-5s6 1.8 6 5m0-12c0-3.2 2.7-5 6-5s6 1.8 6 5" fill="none" stroke="#059669" stroke-width="1.5"/>
    <text x="886" y="448" class="card-title">团队云端</text>
    <text x="886" y="469" class="card-body">登录 · 成员 · 角色 · 文档 · 文件</text>
    <text x="886" y="488" class="card-body">问答 · Wiki · 日报 · 数据源 · 审计</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="816" y="520" width="320" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="834" y="540" width="38" height="38" rx="10" fill="#fff7ed"/>
    <path d="M843 553h8l4 4v9h-12zM851 553v4h4" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <path d="M847 562l3 3 6-6" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <text x="886" y="556" class="card-title">同步与归档</text>
    <text x="886" y="577" class="card-body">sync-local · 云端镜像 · 日报上传</text>
    <text x="886" y="596" class="card-body">制品归档 · 本地分享 · 备份恢复</text>
  </g>

  <!-- Connectors -->
  <path d="M400 242 H440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 350 H440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 458 H440" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M440 458 H400" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 566 H440" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M776 242 H816" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M776 350 H816" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M776 458 H816" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M816 458 H776" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M776 566 H816" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom band -->
  <g filter="url(#shadow)">
    <rect x="64" y="650" width="1072" height="88" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="681" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#0f172a">贯穿全部能力的安全边界</text>
    <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#475569">
      <rect x="88" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="101" y="712">逐库挂载与召回范围</text>
      <rect x="242" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="255" y="712">候选审核与版本冲突</text>
      <rect x="396" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="409" y="712">Token 权限与 CSRF</text>
      <rect x="550" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="563" y="712">只读分享令牌</text>
      <rect x="704" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="717" y="712">自动草稿不自动发布</text>
      <rect x="858" y="696" width="142" height="24" rx="8" fill="#eff6ff"/><text x="871" y="712">审计、备份、恢复</text>
    </g>
  </g>

  <text x="64" y="762" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#94a3b8">版本 2.22.10-custom.1 · 不依赖 OCR 或 embedding · 不修改 DSH Agent Loop</text>
</svg>
